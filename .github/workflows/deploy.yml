name: Vérifier et déployer sur GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérifications
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Vérifier la syntaxe et les règles de code
        run: npm run lint
      - name: Exécuter les tests unitaires
        run: npm test
      - name: Auditer les dépendances
        run: npm audit --audit-level=high
      - name: Construire le site
        run: npm run build
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
      - name: Tester l’interface dans un navigateur
        run: npm run test:ui
      - name: Préparer les fichiers GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: cp dist/index.html dist/404.html
      - name: Envoyer les fichiers GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Déploiement GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  site-check:
    name: Vérifier le site en ligne
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que l’accueil publié répond
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 15 "$SITE_URL" \
            | grep -q '<title>Aboubacrine BAH'
      - name: Vérifier que le fallback des études de cas est publié
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          curl --show-error --silent --retry 10 --retry-all-errors --retry-delay 15 "${SITE_URL%/}/projets/site-business" \
            | grep -q '<title>Aboubacrine BAH'
